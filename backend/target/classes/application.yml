spring:
  application:
    name: klinikpro
  profiles:
    active: dev
  jpa:
    hibernate:
      # Flyway es la unica fuente de verdad del esquema. Hibernate solo valida
      # que las entidades coincidan con las tablas migradas — nunca las crea.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Mexico_City
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

klinikpro:
  jwt:
    # Sobreescribir SIEMPRE en produccion via variable de entorno KLINIKPRO_JWT_SECRET.
    # Debe tener al menos 256 bits (32+ caracteres) para HS256.
    secret: ${KLINIKPRO_JWT_SECRET:dev-only-secret-change-me-before-any-real-deploy-1234567890}
    expiration-minutes: ${KLINIKPRO_JWT_EXPIRATION_MINUTES:480}
