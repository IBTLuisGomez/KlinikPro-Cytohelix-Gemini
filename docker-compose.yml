version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: klinikpro_db
    environment:
      POSTGRES_DB: klinikpro
      POSTGRES_USER: kpro_admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: klinikpro_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cytohelix.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:
